name: Track GitHub Traffic

on:
  schedule:
    # Runs daily at 00:05 UTC to archive traffic
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Store Traffic Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p traffic
          DATE=$(date -u +"%Y-%m-%d")
          
          # Fetch Views
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/views" > traffic/latest_views.json
            
          # Fetch Clones
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones" > traffic/latest_clones.json

          # Fetch Top Referring Sites
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/popular/referrers" > traffic/latest_referrers.json

          # Fetch Top Popular Paths
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/popular/paths" > traffic/latest_paths.json

          # Record snapshot history
          echo "Traffic snapshot recorded on $DATE" >> traffic/history.log

      - name: Commit and Push Traffic Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          if git diff --staged --quiet; then
            echo "No traffic changes to commit"
          else
            git commit -m "📊 Automated Traffic Update [skip ci]"
            git push
          fi
